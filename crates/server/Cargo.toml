[package]
name = "tightlip-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "tightlip"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "=0.23.1"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["server-graceful", "service", "tokio"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
subtle = "=2.6.1"
thiserror = "=2.0.21"
tightlip-core = { path = "../core" }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
futures-util = { version = "=0.3.34", default-features = false }
serde_json = "=1.0.154"
zeroize = "=1.9.2"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }
