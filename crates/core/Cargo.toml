[package]
name = "tightlip-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
base64 = "=0.23.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
rand_core = "=0.6.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
subtle = "=2.6.1"
thiserror = "=2.0.21"
unicode-normalization = "=0.1.26"
voprf = { version = "=0.5.0", default-features = false, features = ["ristretto255-ciphersuite"] }
zeroize = { version = "=1.9.2", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
voprf = { version = "=0.5.0", default-features = false, features = ["danger"] }
