[package]
name = "tightlip-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
dev-mock = ["dep:subtle"]

[dependencies]
js-sys = { version = "=0.3.107", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = { version = "=2.6.1", optional = true }
thiserror = "=2.0.21"
tightlip-core = { path = "../core" }
wasm-bindgen = "=0.2.130"
zeroize = { version = "=1.9.2", features = ["derive"] }
