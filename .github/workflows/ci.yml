name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p tightlip-core --target wasm32-unknown-unknown
      - run: cargo install --locked cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - run: cargo install --locked --version 0.2.130 wasm-bindgen-cli
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
  independent-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv .vector-venv
      - run: .vector-venv/bin/python -m pip install 'cryptography==48.0.1' 'argon2-cffi==25.1.0' 'PyNaCl==1.6.2'
      - name: Build libsodium with the RFC 9380 ristretto255 hash-to-group API
        shell: bash
        run: |
          revision=af0dd1b4ac417fe263d4f6255a57859e6ef85321
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/jedisct1/libsodium/tar.gz/$revision" -o libsodium.tar.gz
          echo 'c87cb379628883ec9d29ac32de05abef3a7f91621afae4ee53522f65b13de107  libsodium.tar.gz' | sha256sum --check
          tar -xzf libsodium.tar.gz
          cd "libsodium-$revision"
          autoreconf -fi
          ./configure --disable-static --prefix="$RUNNER_TEMP/vector-sodium"
          make -j2
          make install
      - run: |
          export TIGHTLIP_VECTOR_SODIUM="$RUNNER_TEMP/vector-sodium/lib/libsodium.so"
          .vector-venv/bin/python tools/vectors/verify.py
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked --version 0.22.0 cargo-deny
      - run: cargo deny check advisories bans sources
